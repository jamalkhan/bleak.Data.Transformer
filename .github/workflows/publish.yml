name: Publish to NuGet

# Publishes when a version tag is pushed, e.g.:  git tag v1.0.0 && git push origin v1.0.0
# The package version is taken from the tag (v1.2.3 -> 1.2.3; v1.2.3-beta.1 -> prerelease).
# Requires the repository secret NUGET_API_KEY (a nuget.org API key allowed to push bleak.Data.Transformer).

on:
  push:
    tags: [ 'v*' ]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_bleak.Data.Transformer#v}" >> "$GITHUB_ENV"
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release -p:Version=$VERSION
      - run: dotnet test --no-build -c Release
      - name: Pack
        run: dotnet pack src/bleak.Data.Transformer/bleak.Data.Transformer.csproj --no-build -c Release -p:Version=$VERSION -o artifacts
      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg
